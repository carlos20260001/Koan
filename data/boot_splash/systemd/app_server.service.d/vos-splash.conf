# Stage 7: the splash lights its last icon and drops DRM master before
# app_server starts, and waits until it has, so app_server's drmSetMaster
# (or logind's TakeDevice) succeeds. The picture stays until app_server
# draws its own; app_server then runs `vos-splash --quit`, or the splash
# leaves by itself after its handoff timeout.
[Unit]
After=vos-splash-stage@6.service

[Service]
ExecStartPre=-/usr/libexec/vos-splash --stage 7
